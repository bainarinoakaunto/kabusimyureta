<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>メンテナンスのお知らせ</title>
<style>
* {
  box-sizing: border-box;
}

html, body {
  margin: 0;
  min-height: 100%;
  font-family: "Yu Gothic", "Meiryo", sans-serif;
  color: #333;
}

body {
  min-height: 100vh;
  min-height: 100svh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background-color: #f8f8f8;

  /* 背景画像は1枚のURLで指定 */
  background-image: url("https://bainarinoakaunto.github.io/image/kabu.jpg");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
}

/* お知らせパネル */
.notice {
  width: min(900px, 100%);
  padding: 38px 28px;
  text-align: center;
  background: rgba(255, 255, 255, 0.91);
}

.notice h1 {
  margin: 0 0 8px;
  font-size: 19px;
  font-weight: 500;
  line-height: 1.8;
}

.notice h2 {
  margin: 0 0 20px;
  font-size: 18px;
  font-weight: 400;
  line-height: 1.8;
}

.notice p {
  margin: 0;
  font-size: 14px;
  line-height: 2;
}

@media (max-width: 600px) {
  body {
    background-attachment: scroll;
  }

  .notice {
    padding: 28px 18px;
  }

  .notice h1 {
    font-size: 17px;
  }

  .notice h2 {
    font-size: 16px;
  }

  .notice p {
    font-size: 13px;
  }
}
</style>
</head>
<body>

<main class="notice">
  <h1>[株シュミレーター26.1]</h1>
  <h2>ただいまメンテナンス中です</h2>
  <p>
    現在、システムメンテナンスを実施しております。<br>
    ご不便をおかけいたしますが、<br>
    しばらく経ってから再度アクセスしてください。
  </p>
</main>

</body>
</html>
